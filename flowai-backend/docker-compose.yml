services:
  redis:
    image: redis:7-alpine
    container_name: flowai-redis
    restart: unless-stopped
    # 轻量机限制内存，仅用于 AI 日限额计数
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    expose:
      - "6379"
    mem_limit: 48m

  api:
    image: flowai-api:latest
    container_name: flowai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      REDIS_URL: redis://redis:6379
    expose:
      - "3001"
    depends_on:
      - redis
    # 0.5G 机器：限制容器内存，避免把系统拖死
    # mem_limit: 320m

  caddy:
    image: caddy:2-alpine
    container_name: flowai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
